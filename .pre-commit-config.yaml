#
# Install with: pre-commit install
# Run on all files with: pre-commit run --all-files
exclude: ^(build|install|log)/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-xml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8

  - repo: https://github.com/jlevy/flowmark
    rev: v0.7.3
    hooks:
      - id: flowmark
        # Not using --auto: it forces --semantic (which splits the copyright
        # header across lines) plus --smartquotes/--ellipses.
        args: [--inplace, --nobackup, --cleanups, --force-exclude]
