# Dependabot supports scanning the PyPI requirements installed by Pip, and the
# actions used by the CI workflow. Dependabot does not support ROS dependencies
# installed by Rosdep, or repos installed by VCS.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "23:59"
      timezone: "America/New_York"
    commit-message:
      prefix: "[dependabot] "
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "23:59"
      timezone: "America/New_York"
    commit-message:
      prefix: "[dependabot] "
    open-pull-requests-limit: 5
