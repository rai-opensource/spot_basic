[flake8]
max-line-length = 120
# Black owns code formatting and line length; ignore rules that conflict with it.
# E203/W503 clash with black; E501 fires on long URLs in docstrings black cannot wrap;
# E731 is a deliberate style in the trajectory interpolation helpers.
extend-ignore = E203, W503, E501, E731
exclude =
    .git,
    __pycache__,
    build,
    install,
    log
per-file-ignores =
    # Package __init__ modules intentionally re-export symbols.
    __init__.py: F401
