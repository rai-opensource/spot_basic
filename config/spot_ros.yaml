/**:
  ros__parameters:
    username: "user"
    password: "bbbdddaaaiii"
    hostname: "10.17.30.33" # Nyla

    metrics_rate: 0.04
    lease_rate: 1.0
    auto_claim: False
    auto_power_on: False
    auto_stand: False
    estop_timeout: 9.0
    start_estop: False
    cmd_duration: 0.25

    # Uncomment the parameters below for your specific use case
    # publish_graph_nav_pose: True
    # initialize_spot_cam: True

    # Uncomment and edit the list below if you only want to publish data from a certain set of cameras.
    # cameras_used: ["frontleft", "frontright", "left", "right", "back", "hand"]

    # Uncomment and edit if you wish to change default frames used in TF and odometry construction. The default for both is "odom".
    # preferred_odom_frame: "odom" # pass either odom/vision. This will be used in the odometry topic. https://dev.bostondynamics.com/docs/concepts/geometry_and_frames.html?highlight=frame#frames-in-the-spot-robot-world for more info.
    # tf_root: "odom" # Use "odom" (default), "vision", or "body" for the root frame in your TF tree.

    # The following parameters are used in the image stitcher node and were determined through a lot of manual tuning.
    # They can be adjusted if the stitched image looks incorrect on your robot.

    # Virtual camera intrinsic matrix [fx, 0, cx, 0, fy, cy, 0, 0, 1]
    # fx stretches the image left-right, fy zooms in, cx moves the image left-right, cy moves the image up-down.
    virtual_camera_intrinsics: [385.0, 0.0, 315.0, 0.0, 385.0, 844.0, 0.0, 0.0, 1.0]
    # Plane that the stitched image is projected on with respect to the virtual camera frame.
    virtual_camera_projection_plane: [-0.15916, 0.0, 0.987253]
    # The distance from the virtual camera frame to the projection plane
    virtual_camera_plane_distance: 0.5
    # The stitched image will be of size (<frontleft image width>, <frontleft image height> + row_padding)
    stitched_image_row_padding: 1182
